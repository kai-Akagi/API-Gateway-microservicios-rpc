quarkus.http.port=8082
quarkus.datasource.db-kind=mysql
quarkus.datasource.username=root
quarkus.datasource.password=ITSON
quarkus.datasource.jdbc.url=jdbc:mysql://localhost:3306/ordenes_db
quarkus.hibernate-orm.database.generation=update
quarkus.rest-client.producto-api.url=http://localhost:8081
# --- API Gateway ---
# Por defecto Orden consulta a Productos directamente (comunicacion interna entre servicios).
# Para que esa llamada tambien pase por el API Gateway, comenta la linea de arriba
# y usa esta (el cliente agrega /productos/{id}, resultando /api/productos/{id}):
# quarkus.rest-client.producto-api.url=http://localhost:8080/api

# --- gRPC (RPC sobre HTTP/2) ---
# Servidor gRPC separado del REST (8082). El API Gateway le habla aqui con grpc_pass.
quarkus.grpc.server.use-separate-server=true
quarkus.grpc.server.host=0.0.0.0
quarkus.grpc.server.port=9082
quarkus.grpc.server.enable-reflection-service=true
