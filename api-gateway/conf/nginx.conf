# ============================================================
#  API Gateway con NGINX  (ejecución local, sin Docker)
#
#  El cliente envía peticiones al gateway y NGINX las enruta
#  a los microservicios:
#
#   gRPC  (RPC sobre HTTP/2, baja latencia)      grpc_pass   -> gateway :9090
#     /productos.ProductoService/*  ->  EjemploQuarkus  :9081
#     /ordenes.OrdenService/*       ->  OrdenQuarkus    :9082
#
#   REST  (HTTP/1.1 + JSON, como la tarea anterior)  proxy_pass  -> gateway :8080
#     /api/productos[/...]          ->  EjemploQuarkus  :8081
#     /api/ordenes[/...]            ->  OrdenQuarkus    :8082
#
#  Ejecutar desde la carpeta api-gateway:
#    nginx -p . -c conf/nginx.conf
# ============================================================

worker_processes 1;
error_log logs/error.log warn;
pid       logs/nginx.pid;

events {
    worker_connections 1024;
}

http {
    default_type application/json;
    sendfile     on;

    # Bitácora: protocolo del cliente (HTTP/1.1 o HTTP/2.0) y a qué servicio se enrutó
    log_format gateway '$remote_addr [$time_local] "$request" $server_protocol $status '
                       '-> $upstream_addr ($upstream_response_time s)';
    access_log logs/access.log gateway;

    # ---------- Microservicios ----------
    # gRPC (HTTP/2)
    upstream productos_grpc {
        server 127.0.0.1:9081;
        keepalive 16;
    }
    upstream ordenes_grpc {
        server 127.0.0.1:9082;
        keepalive 16;
    }
    # REST (HTTP/1.1)
    upstream productos_svc {
        server 127.0.0.1:8081;
        keepalive 16;
    }
    upstream ordenes_svc {
        server 127.0.0.1:8082;
        keepalive 16;
    }

    # Límite de peticiones REST por IP
    limit_req_zone $binary_remote_addr zone=api:10m rate=20r/s;

    server {
        # Dos puertos de entrada (en texto plano, un puerto "http2" solo acepta HTTP/2):
        #   8080 -> HTTP/1.1  (clientes REST / navegador / curl)
        #   9090 -> HTTP/2    (clientes gRPC)
        listen 8080;
        listen 9090 http2;
        server_name localhost;

        # --- Cabeceras comunes de proxy (REST) ---
        proxy_http_version 1.1;
        proxy_set_header Connection        "";
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 3s;
        proxy_read_timeout    30s;

        # --- CORS (por si un frontend web consume el gateway REST) ---
        add_header Access-Control-Allow-Origin  "*" always;
        add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Content-Type, Authorization" always;
        if ($request_method = OPTIONS) {
            return 204;
        }

        # --- Errores del gateway en JSON (REST) ---
        error_page 502 503 504 = @servicio_no_disponible;
        location @servicio_no_disponible {
            return 503 '{"error":"Servicio no disponible","detalle":"El microservicio no responde. Verifica que este en ejecucion."}\n';
        }

        # --- Rutas informativas del propio gateway ---
        location = / {
            return 200 '{"gateway":"nginx","grpc":["/productos.ProductoService/","/ordenes.OrdenService/"],"rest":["/api/productos","/api/ordenes"]}\n';
        }
        location = /health {
            return 200 '{"estado":"UP"}\n';
        }

        # =====================================================
        #  gRPC -> HTTP/2 hacia los microservicios (grpc_pass)
        #  La ruta de una llamada gRPC es /<paquete>.<Servicio>/<Metodo>
        # =====================================================
        location /productos.ProductoService/ {
            grpc_pass grpc://productos_grpc;
            grpc_set_header X-Real-IP $remote_addr;
            grpc_connect_timeout 3s;
            grpc_read_timeout    30s;
            grpc_send_timeout    30s;
            error_page 502 503 504 = @grpc_no_disponible;
        }
        location /ordenes.OrdenService/ {
            grpc_pass grpc://ordenes_grpc;
            grpc_set_header X-Real-IP $remote_addr;
            grpc_connect_timeout 3s;
            grpc_read_timeout    30s;
            grpc_send_timeout    30s;
            error_page 502 503 504 = @grpc_no_disponible;
        }
        # Error en formato gRPC (respuesta "trailers-only"): grpc-status 14 = UNAVAILABLE
        location @grpc_no_disponible {
            default_type application/grpc;
            add_header grpc-status  14 always;
            add_header grpc-message "Servicio no disponible" always;
            return 200 "";
        }

        # =====================================================
        #  REST -> HTTP/1.1 (proxy_pass)
        # =====================================================
        # /api/productos -> /productos   |   /api/productos/5 -> /productos/5
        location = /api/productos {
            limit_req zone=api burst=40 nodelay;
            limit_req_status 429;
            proxy_pass http://productos_svc/productos;
        }
        location /api/productos/ {
            limit_req zone=api burst=40 nodelay;
            limit_req_status 429;
            proxy_pass http://productos_svc/productos/;
        }
        location = /api/ordenes {
            limit_req zone=api burst=40 nodelay;
            limit_req_status 429;
            proxy_pass http://ordenes_svc/ordenes;
        }
        location /api/ordenes/ {
            limit_req zone=api burst=40 nodelay;
            limit_req_status 429;
            proxy_pass http://ordenes_svc/ordenes/;
        }

        # --- Cualquier otra ruta ---
        location / {
            return 404 '{"error":"Ruta no encontrada en el gateway"}\n';
        }
    }
}
